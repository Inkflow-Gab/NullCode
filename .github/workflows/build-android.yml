name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: |
          set -o pipefail
          bun --version
          bun install --ignore-scripts 2>&1 | tee install.log

      - name: Build web app
        run: |
          set -o pipefail
          bun --cwd packages/app build 2>&1 | tee build-web.log

      - name: Setup Capacitor Android
        run: |
          set -o pipefail
          cd packages/app
          bun add -d @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 2>&1 | tee ../../capacitor-deps.log
          if [ ! -d android ]; then
            npx cap add android 2>&1 | tee ../../cap-add.log
          fi
          npx cap sync android 2>&1 | tee ../../cap-sync.log

      - name: Build debug APK
        run: |
          set -o pipefail
          cd packages/app/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../../gradle.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NullCode-debug-apk
          path: packages/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            install.log
            build-web.log
            capacitor-deps.log
            cap-add.log
            cap-sync.log
            gradle.log
          if-no-files-found: ignore
