name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          bun --version
          rm -f bun.lock
          bun install --ignore-scripts 2>&1 | tee install.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Show install log tail
        if: always()
        run: |
          echo "----- install.log tail -----"
          tail -n 200 install.log || true
          echo "----- end -----"
          exit ${{ steps.install.outputs.exit_code || 1 }}

      - name: Build web app
        run: |
          set -o pipefail
          bun --cwd packages/app build 2>&1 | tee build-web.log

      - name: Setup Capacitor Android
        run: |
          set -o pipefail
          cd packages/app
          bun add -d @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 2>&1 | tee ../../capacitor-deps.log
          if [ ! -d android ]; then
            npx cap add android 2>&1 | tee ../../cap-add.log
          fi

      - name: Apply app icon
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ICON="packages/app/resources/icon.jpg"
          RES="packages/app/android/app/src/main/res"
          test -f "$ICON"
          test -d "$RES"
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/$dir"
            ffmpeg -y -i "$ICON" -vf "scale=${size}:${size}:force_original_aspect_ratio=increase,crop=${size}:${size}" "$RES/$dir/ic_launcher.png"
            ffmpeg -y -i "$ICON" -vf "scale=${size}:${size}:force_original_aspect_ratio=increase,crop=${size}:${size}" "$RES/$dir/ic_launcher_round.png"
            ffmpeg -y -i "$ICON" -vf "scale=${size}:${size}:force_original_aspect_ratio=increase,crop=${size}:${size}" "$RES/$dir/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/drawable-v24" "$RES/values" "$RES/mipmap-anydpi-v26"
          printf '%s\n' '<bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:gravity="center" android:src="@mipmap/ic_launcher_foreground" />' > "$RES/drawable-v24/ic_launcher_foreground.xml"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="ic_launcher_background">#000000</color>' '</resources>' > "$RES/values/ic_launcher_background.xml"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@color/ic_launcher_background"/>' '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@color/ic_launcher_background"/>' '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          cd packages/app
          npx cap sync android 2>&1 | tee ../../cap-sync.log

      - name: Configure release signing
        run: |
          set -euo pipefail
          cp keystore/nullcode-release.keystore packages/app/android/app/nullcode-release.keystore
          cat > packages/app/android/keystore.properties <<'PROPS'
          storeFile=app/nullcode-release.keystore
          storePassword=nullcode123
          keyAlias=nullcode
          keyPassword=nullcode123
          PROPS
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/app/android/app/build.gradle')
          s = p.read_text()
          if 'keystoreProperties' not in s:
              pre = "def keystoreProperties = new Properties()\n" \
                    "def keystorePropertiesFile = rootProject.file('keystore.properties')\n" \
                    "if (keystorePropertiesFile.exists()) {\n" \
                    "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n" \
                    "}\n\n"
              s = s.replace('android {', pre + 'android {', 1)
          if 'signingConfigs' not in s:
              sig = "    signingConfigs {\n" \
                    "        release {\n" \
                    "            if (keystorePropertiesFile.exists()) {\n" \
                    "                storeFile file(keystoreProperties['storeFile'])\n" \
                    "                storePassword keystoreProperties['storePassword']\n" \
                    "                keyAlias keystoreProperties['keyAlias']\n" \
                    "                keyPassword keystoreProperties['keyPassword']\n" \
                    "            }\n" \
                    "        }\n" \
                    "    }\n"
              s = s.replace('    buildTypes {', sig + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('        release {', '        release {\n            if (keystorePropertiesFile.exists()) {\n                signingConfig signingConfigs.release\n            }', 1)
          p.write_text(s)
          print('gradle patched')
          PY

      - name: Build signed release APK
        run: |
          set -o pipefail
          cd packages/app/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../../../gradle-release.log

      - name: Build debug APK
        run: |
          set -o pipefail
          cd packages/app/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../../gradle.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NullCode-apk
          path: |
            packages/app/android/app/build/outputs/apk/release/*.apk
            packages/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            install.log
            build-web.log
            capacitor-deps.log
            cap-add.log
            cap-sync.log
            gradle.log
            gradle-release.log
          if-no-files-found: ignore
